// ── Helpers ─────────────────────────────────────────────────────────
async function hashPin(p){var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("porra2026:"+p));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0");}).join("");}
function outcome(a,b){if(a==null||b==null||a===""||b==="")return null;return+a>+b?"1":+a<+b?"2":"X";}
function calcPts(pred,res,ph){if(!pred||!res||res.home==null||res.home==="")return 0;if(pred.home===""||pred.away==="")return 0;var p=PH[ph]||PH.grupos;if(+pred.home===+res.home&&+pred.away===+res.away)return p.e;if(outcome(pred.home,pred.away)===outcome(res.home,res.away))return p.h;return 0;}
function isClosed(m,now){return m.locked||(!!m.kickoff&&now>=m.kickoff-LOCK);}
function isLive(m,now){return!!m.kickoff&&now>=m.kickoff&&now<=m.kickoff+105*60*1000&&m.result.home==="";}
function horaES(ts){try{return new Date(ts).toLocaleString("es-ES",{timeZone:"Europe/Madrid",weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})+"h";}catch(e){return"";}}
function dKey(ts){try{var f=new Intl.DateTimeFormat("es-ES",{timeZone:"Europe/Madrid",year:"numeric",month:"2-digit",day:"2-digit"});var p=Object.fromEntries(f.formatToParts(new Date(ts)).map(function(x){return[x.type,x.value];}));return p.year+"-"+p.month+"-"+p.day;}catch(e){return"x";}}
function dLabel(ts){try{var s=new Date(ts).toLocaleDateString("es-ES",{timeZone:"Europe/Madrid",weekday:"long",day:"numeric",month:"long"}).replace(",","");return s[0].toUpperCase()+s.slice(1);}catch(e){return"";}}
function desg(ms){var s=Math.max(0,Math.floor(ms/1000));return{d:Math.floor(s/86400),h:Math.floor((s%86400)/3600),m:Math.floor((s%3600)/60),s:s%60};}
var norm=function(s){return(s||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ");};

function calcTabla(grupo,matches){
  var eq=GRUPOS[grupo]||[];var t={};
  eq.forEach(function(e){t[e]={e:e,pj:0,g:0,em:0,p:0,gf:0,gc:0,pts:0};});
  matches.forEach(function(m){
    if(!eq.includes(m.home)||!eq.includes(m.away))return;
    if(m.result.home===""||m.result.away==="")return;
    var gh=+m.result.home,ga=+m.result.away;
    t[m.home].pj++;t[m.away].pj++;t[m.home].gf+=gh;t[m.home].gc+=ga;t[m.away].gf+=ga;t[m.away].gc+=gh;
    if(gh>ga){t[m.home].g++;t[m.home].pts+=3;t[m.away].p++;}
    else if(gh<ga){t[m.away].g++;t[m.away].pts+=3;t[m.home].p++;}
    else{t[m.home].em++;t[m.home].pts++;t[m.away].em++;t[m.away].pts++;}
  });
  return Object.values(t).sort(function(a,b){return b.pts-a.pts||(b.gf-b.gc)-(a.gf-a.gc)||b.gf-a.gf;});
}

function calcStats(pl,matches,preds){
  var byPhase={};var cur=0,maxS=0;
  var sorted=matches.filter(function(m){return m.result.home!=="";}).sort(function(a,b){return(a.kickoff||0)-(b.kickoff||0);});
  sorted.forEach(function(m){
    var ph=m.phase||"grupos";var p=calcPts(preds[pl]&&preds[pl][m.id],m.result,ph);
    if(!byPhase[ph])byPhase[ph]={pts:0,played:0,exact:0,hit:0};
    byPhase[ph].played++;byPhase[ph].pts+=p;
    if(p===(PH[ph]||PH.grupos).e){byPhase[ph].exact++;cur++;}else{maxS=Math.max(maxS,cur);cur=0;}
    if(p>0)byPhase[ph].hit++;
  });
  maxS=Math.max(maxS,cur);
  var total=sorted.length;
  var totalPts=Object.values(byPhase).reduce(function(s,v){return s+v.pts;},0);
  var totalHit=Object.values(byPhase).reduce(function(s,v){return s+v.hit;},0);
  var totalExact=Object.values(byPhase).reduce(function(s,v){return s+v.exact;},0);
  return{byPhase:byPhase,total:total,totalPts:totalPts,totalHit:totalHit,totalExact:totalExact,maxStreak:maxS,pct:total?Math.round(totalHit/total*100):0};
}

function calcBadges(pl,matches,preds,standings,champion){
  var earned=new Set();
  var sorted=matches.filter(function(m){return m.result.home!=="";}).sort(function(a,b){return(a.kickoff||0)-(b.kickoff||0);});
  var cur=0,totalPts=0;
  var byDay={};
  sorted.forEach(function(m){
    var ph=m.phase||"grupos";var p=calcPts(preds[pl]&&preds[pl][m.id],m.result,ph);
    totalPts+=p;
    if(p===(PH[ph]||PH.grupos).e){cur++;earned.add("first_exact");if(cur>=3)earned.add("streak3");if(cur>=5)earned.add("streak5");}else cur=0;
    if(m.kickoff){var dk=dKey(m.kickoff);if(!byDay[dk])byDay[dk]={total:0,hit:0};byDay[dk].total++;if(p>0)byDay[dk].hit++;}
  });
  Object.values(byDay).forEach(function(d){if(d.total>=2&&d.hit===d.total)earned.add("perfect_day");});
  if(totalPts>=100)earned.add("century");
  if(standings.length>0&&standings[0].name===pl)earned.add("top1");
  var acertados=new Set();
  sorted.forEach(function(m){
    if(calcPts(preds[pl]&&preds[pl][m.id],m.result,m.phase||"grupos")>0){
      Object.keys(GRUPOS).forEach(function(g){if((GRUPOS[g]||[]).includes(m.home)||(GRUPOS[g]||[]).includes(m.away))acertados.add(g);});
    }
  });
  if(acertados.size>=Object.keys(GRUPOS).length)earned.add("all_groups");
  if(champion&&champion[pl]){
    var finalM=matches.find(function(m){return m.phase==="final"&&m.result.home!=="";});
    if(finalM){var w=+finalM.result.home>+finalM.result.away?finalM.home:finalM.away;if(norm(w)===norm(champion[pl]))earned.add("champion_ok");}
  }
  return BADGES.filter(function(b){return earned.has(b.id);});
}

async function requestNotifPermission(toast2){
  if(!("Notification" in window)){toast2("Tu navegador no soporta notificaciones");return false;}
  if(Notification.permission==="granted")return true;
  if(Notification.permission==="denied"){toast2("Notificaciones bloqueadas en ajustes del navegador");return false;}
  var result=await Notification.requestPermission();
  return result==="granted";
}

function scheduleNotifs(matches,preds,me,now){
  if(!("Notification" in window)||Notification.permission!=="granted")return;

  // ── Aviso "mañana tienes partidos sin rellenar" a las 21:00h ─────
  // Agrupa los partidos de mañana que el usuario NO ha rellenado
  var todayES=new Date(now);
  // Offset España: UTC+1 invierno / UTC+2 verano
  var tzOffset=(new Date().getTimezoneOffset())*60*1000; // ms
  var nowLocal=now-tzOffset; // aproximación local
  var hLocal=new Date(nowLocal).getUTCHours();
  var mLocal=new Date(nowLocal).getUTCMinutes();

  // Fecha de mañana en UTC — partidos cuyo kickoff sea entre mañana 00:00 y mañana 23:59 (hora local)
  var startOfTomorrow=now - (now % 86400000) + 86400000; // 00:00 UTC mañana
  var endOfTomorrow=startOfTomorrow+86400000;

  function getPendingTomorrow(){
    return matches.filter(function(m){
      if(!m.kickoff||m.result.home!=="")return false;
      if(m.kickoff<startOfTomorrow||m.kickoff>=endOfTomorrow)return false;
      var p=preds&&preds[me]&&preds[me][m.id];
      return!(p&&p.home!=null&&p.home!==""&&p.away!=null&&p.away!=="");
    });
  }

  function fireEveningNotif(){
    var pending=getPendingTomorrow();
    if(!pending.length)return;
    var teams=pending.slice(0,3).map(function(m){return m.home+" vs "+m.away;}).join(", ");
    var extra=pending.length>3?" y "+(pending.length-3)+" más":"";
    if(Notification.permission==="granted")
      new Notification("⚽ Mañana hay "+(pending.length===1?"un partido":"partidos")+" sin rellenar",{
        body:teams+extra+" · ¡Pon tus pronósticos antes de que cierren!",
        icon:"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>"
      });
  }

  // Son las 20-22h → lanzar ya
  if(hLocal>=20&&hLocal<22){
    fireEveningNotif();
  } else if(hLocal<20){
    // Programar para las 21:00h de hoy
    var target21=now - (now % 86400000) + (21*3600+tzOffset/1000)*1000; // 21h local aprox
    // Ajuste más preciso: calcular ms hasta las 21:00 hora local de hoy
    var nowDate=new Date(now);
    var target=new Date(nowDate);
    target.setHours(21,0,0,0);
    var msUntil=target.getTime()-now;
    if(msUntil>0){
      setTimeout(fireEveningNotif, msUntil);
    }
  }
  // Si ya son >22h, no hacemos nada hasta mañana
}
